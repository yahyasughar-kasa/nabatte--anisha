<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My calculator</title>
    <link rel="stylesheet" href="sytle.css">
</head>
<body>
    <div id="calculator">
        <div id="display">0</div>
        <div>
            <button class="ac">AC</button>
            <button>00</button>
            <button>%</button>
            <button class="operator">/</button>

        </div>
        <div>
            <button>7</button>
            <button>8</button>
            <button>9</button>
            <button class="operator">*</button>
        </div>
        <div>
            <button>4</button>
            <button>5</button>
            <button>6</button>
            <button class="operator">+</button>
        </div>
        <div>
            <button class="back">0</button>
            <button>.</button>
            <button class="operator">=</button>
        </div>

    </div>
</body>
</html>
